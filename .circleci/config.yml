version: 2
jobs:
  build-python311:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - restore_cache:
          key: deps-{{ checksum "setup.py" }}
      - run:
          command: |
            python3 -m venv venv
            . venv/bin/activate
            pip3 install setuptools --upgrade
            python3 setup.py develop
      - save_cache:
          key: deps-{{ checksum "setup.py" }}
          paths:
            - venv
      - run:
          command: |
            . venv/bin/activate
            pip install -r requirements/requirements_test.txt
            flake8 ./pylivetrader && echo "Flake8 passed"
            pytest

workflows:
  version: 2
  build:
    jobs:
      - build-python311
